name: Build SearXNG image

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/searxng/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/searxng
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ex-games-searxng:latest
