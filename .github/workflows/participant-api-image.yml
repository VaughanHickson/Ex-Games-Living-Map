name: Build participant API image

on:
  workflow_dispatch:
  push:
    paths:
      - 'deploy/participant-api/**'
      - 'edge/**'
      - 'shared/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/participant-api/Dockerfile
          push: true
          tags: ghcr.io/vaughanhickson/ex-games-participant-api:latest
